# Spec linting for api/openapi.yaml. Run with `make lint-api`.
extends:
  - recommended

rules:
  # security-defined stays on: it catches an endpoint shipped without
  # declaring who may call it. Health and login opt out with `security: []`.

  # Servers are localhost and a loopback dev port by design (appliance and
  # docker-compose.dev.yml). The rule is aimed at placeholder hosts.
  no-server-example.com: off

  # /api/healthz answers 200 or 503 and nothing else. A readiness probe has no
  # 4xx to give.
  operation-4xx-response: off

  # Internal project; no license block.
  info-license: off

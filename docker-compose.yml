name: loghub

x-backend-env: &backend-env
  LOG_LEVEL: ${LOG_LEVEL:-info}

# The table owner. Only migrate and seed connect as it; the backend uses loghub_app.
x-owner-database-url: &owner-database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Check over TCP: the entrypoint's temporary init server listens only on the
      # Unix socket, so a socket check passes before other containers can connect.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    image: loghub-backend
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *backend-env
      MIGRATE_DATABASE_URL: *owner-database-url
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set it in .env}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: ./backend
    image: loghub-backend
    command: ["seed"]
    restart: "no"
    environment:
      <<: *backend-env
      MIGRATE_DATABASE_URL: *owner-database-url
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@loghub.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set it in .env}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:?set it in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build: ./backend
    image: loghub-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://loghub_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:?set it in .env}
      INGEST_TOKEN: ${INGEST_TOKEN:?set it in .env}
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/loghub", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # The only public HTTP entry point: TLS, the UI, and /api passed to the
  # backend. See frontend/Caddyfile.
  caddy:
    build: ./frontend
    image: loghub-caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates, and the CA that signs them for localhost and private addresses.
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Syslog on 514 and NDJSON files dropped into inbox/, forwarded to the
  # backend. See ingest/README.md.
  vector:
    image: timberio/vector:0.58.0-alpine
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      # Read by the syslog transform at runtime.
      SYSLOG_DEFAULT_TENANT: ${SYSLOG_DEFAULT_TENANT:-demoA}
    # Vector reads secrets from files, not the environment (ADR 0004).
    secrets:
      - ingest_token
    ports:
      - "514:5514/udp"
      - "514:5514/tcp"
    volumes:
      - ./ingest/vector.yaml:/etc/vector/vector.yaml:ro
      # Writable: Vector deletes each file once it has read it.
      - ./inbox:/inbox
      - vector_data:/var/lib/vector
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8686/health"]
      interval: 10s
      timeout: 3s
      retries: 6

secrets:
  # Mounted at /run/secrets/ingest_token.
  ingest_token:
    environment: INGEST_TOKEN

volumes:
  postgres_data:
  vector_data:
  caddy_data:
  caddy_config:

openapi: 3.0.3

info:
  title: loghub API
  version: 0.1.0
  description: |
    Multi-tenant log management: ingest events from many sources, normalize them
    into one schema, and search them.

    ## Shape of this API

    Ingest is permissive and search is strict. A sender may post whatever its
    vendor emits; unknown fields are preserved verbatim in `raw` and stay
    searchable. What comes back out of search is the normalized schema, with
    every field named as in the common event schema.

    ## Errors

    Every error is the same JSON envelope: a stable `code` to match on, a
    human `message` that may change, and `request_id` correlating with the
    server log. `422` additionally carries per-field failures in `errors[]`;
    no other status does.

    A `404` or `405` from an unrouted path is generated by the Go HTTP mux and
    is plain text rather than this envelope.

    ## Not yet implemented

    This is the first slice. Authentication is not wired up: no endpoint
    currently requires a credential, and `tenant` is taken from the request
    rather than from a verified token. Both change in the auth milestone, and
    the affected fields say so individually.

servers:
  - url: https://localhost
    description: Appliance, behind Caddy
  - url: http://127.0.0.1:8080
    description: Backend directly (docker-compose.dev.yml)

tags:
  - name: Health
    description: Liveness and readiness.
  - name: Ingest
    description: |
      Getting events in. Three paths, one normalizer: a single JSON event, an
      NDJSON batch from the collector, and a whole vendor export file.
  - name: Search
    description: Querying stored events.

paths:
  /api/healthz:
    get:
      operationId: getHealth
      summary: Readiness probe
      description: |
        Reports whether the service can reach its database. Used by the
        container healthcheck and by the `loghub healthcheck` subcommand,
        both of which read only the status code.
      tags: [Health]
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/ingest:
    post:
      operationId: ingestEvent
      summary: Ingest a single event
      description: |
        Accepts one vendor event as JSON, normalizes it, and stores it. The
        event is committed before this call returns, so it is searchable
        immediately.

        Caddy exposes this as `POST /ingest` at the edge, which is the form
        the sample senders use.
      tags: [Ingest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEvent'
            examples:
              api:
                summary: Application event
                value:
                  tenant: demoA
                  source: api
                  event_type: app_login_failed
                  user: alice
                  ip: 203.0.113.7
                  reason: wrong_password
                  '@timestamp': '2025-08-20T07:20:00Z'
              ad:
                summary: Windows Security 4625
                value:
                  tenant: demoA
                  source: ad
                  event_id: 4625
                  event_type: LogonFailed
                  user: demo\eve
                  host: DC01
                  ip: 203.0.113.77
                  logon_type: 3
                  '@timestamp': '2025-08-20T11:11:11Z'
              crowdstrike:
                summary: Endpoint detection
                value:
                  tenant: demoA
                  source: crowdstrike
                  event_type: malware_detected
                  host: WIN10-01
                  process: powershell.exe
                  severity: 8
                  sha256: abc...
                  action: quarantine
                  '@timestamp': '2025-08-20T08:00:00Z'
              aws:
                summary: CloudTrail
                value:
                  tenant: demoB
                  source: aws
                  cloud:
                    service: iam
                    account_id: '123456789012'
                    region: ap-southeast-1
                  event_type: CreateUser
                  user: admin
                  '@timestamp': '2025-08-20T09:10:00Z'
                  raw:
                    eventName: CreateUser
                    requestParameters:
                      userName: temp-user
              m365:
                summary: Microsoft 365 audit
                value:
                  tenant: demoB
                  source: m365
                  event_type: UserLoggedIn
                  user: bob@demo.local
                  ip: 198.51.100.23
                  status: Success
                  workload: Exchange
                  '@timestamp': '2025-08-20T10:05:00Z'
      responses:
        '200':
          description: |
            Processed. `accepted` is 1 when the event was stored; a rejected
            event reports why in `errors[0]`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/ingest/batch:
    post:
      operationId: ingestBatch
      summary: Ingest a batch of events as NDJSON
      description: |
        One JSON event per line. This is what the collector forwards after
        buffering syslog and file input.

        A malformed or unmappable line does not fail the request: the response
        reports `accepted` and `rejected` counts with per-line detail. This is
        deliberate — the collector retries any non-2xx response from its disk
        buffer, so rejecting a whole batch for one poison line would retry it
        forever and stall the buffer behind it. A non-2xx status here means the
        request was unusable as a whole, not that some records were bad.
      tags: [Ingest]
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: Newline-delimited JSON; one event object per line.
            example: |
              {"tenant":"demoA","message":"<134>Aug 20 12:44:56 fw01 vendor=demo product=ngfw action=deny src=10.0.1.10 dst=8.8.8.8 spt=5353 dpt=53 proto=udp msg=DNS blocked policy=Block-DNS"}
              {"tenant":"demoA","source":"api","event_type":"app_login_failed","user":"alice","ip":"203.0.113.7","@timestamp":"2025-08-20T07:20:00Z"}
      responses:
        '200':
          description: Batch processed; counts report how many records stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/ingest/file:
    post:
      operationId: ingestFile
      summary: Ingest a whole export file as NDJSON
      description: |
        Same wire format and same per-record error handling as the batch
        endpoint, for uploading a vendor export directly:

        ```
        curl -H 'Content-Type: application/x-ndjson' \
             --data-binary @samples/json/aws_cloudtrail.ndjson \
             https://localhost/api/v1/ingest/file
        ```

        `tenant` and `source` may be supplied as query parameters, and apply
        only to records that do not carry their own.
      tags: [Ingest]
      parameters:
        - name: tenant
          in: query
          required: false
          description: Default tenant for records that omit one.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,64}$'
        - name: source
          in: query
          required: false
          description: Default source for records that omit one.
          schema:
            $ref: '#/components/schemas/Source'
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: Newline-delimited JSON; one event object per line.
      responses:
        '200':
          description: File processed; counts report how many records stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/events:
    get:
      operationId: searchEvents
      summary: Search events
      description: |
        Filtered, time-ordered list of normalized events.

        Results are paged with an opaque cursor rather than an offset. Events
        arrive continuously, so an offset would shift under the reader between
        pages, showing duplicates and silently skipping rows. Pass the
        `next_cursor` from one response as `cursor` on the next request; its
        absence means there are no more results.

        A cursor is tied to the filters it was produced with. Re-using one with
        different filters is rejected rather than silently paging through a
        different result set.
      tags: [Search]
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SourceFilter'
        - $ref: '#/components/parameters/EventTypeFilter'
        - $ref: '#/components/parameters/ActionFilter'
        - $ref: '#/components/parameters/SeverityMin'
        - $ref: '#/components/parameters/SeverityMax'
        - $ref: '#/components/parameters/SrcIpFilter'
        - $ref: '#/components/parameters/UserFilter'
        - $ref: '#/components/parameters/HostFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Matching events, newest first unless `order=asc`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:

  parameters:

    TenantFilter:
      name: tenant
      in: query
      required: false
      description: |
        Narrows results to one tenant, within the set the caller may already
        read. This parameter can only narrow, never widen: the readable set is
        enforced beneath the API by row-level security.

        Omitting it is always safe and is the common case — it returns
        everything the caller may see.

        Until authentication is wired up there is no caller identity, so
        omitting it currently returns every tenant.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
      example: demoA

    From:
      name: from
      in: query
      required: false
      description: Only events at or after this time. Defaults to 24 hours ago.
      schema:
        type: string
        format: date-time
      example: '2025-08-20T00:00:00Z'

    To:
      name: to
      in: query
      required: false
      description: Only events strictly before this time. Defaults to now.
      schema:
        type: string
        format: date-time

    SourceFilter:
      name: source
      in: query
      required: false
      description: Repeat to match any of several sources.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Source'

    EventTypeFilter:
      name: event_type
      in: query
      required: false
      schema:
        type: string

    ActionFilter:
      name: action
      in: query
      required: false
      schema:
        type: string
      example: deny

    SeverityMin:
      name: severity_min
      in: query
      required: false
      description: Only events with severity at or above this. Excludes events with no severity.
      schema:
        type: integer
        minimum: 0
        maximum: 10

    SeverityMax:
      name: severity_max
      in: query
      required: false
      description: Only events with severity at or below this. Excludes events with no severity.
      schema:
        type: integer
        minimum: 0
        maximum: 10

    SrcIpFilter:
      name: src_ip
      in: query
      required: false
      description: Exact source address match.
      schema:
        type: string
      example: 203.0.113.77

    UserFilter:
      name: user
      in: query
      required: false
      description: Exact match on the user associated with the event.
      schema:
        type: string

    HostFilter:
      name: host
      in: query
      required: false
      schema:
        type: string

    TagFilter:
      name: tag
      in: query
      required: false
      description: Repeat to require several tags; an event must carry all of them.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string

    Query:
      name: q
      in: query
      required: false
      description: |
        Free-text match against the original payload. Matches substrings, and
        is the slowest filter available — narrow the time range with it.
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      description: Maximum events to return. Defaults to 50.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The `next_cursor` from a previous response. Opaque: its encoding is not
        part of this contract and may change between releases.
      schema:
        type: string

    Order:
      name: order
      in: query
      required: false
      description: Order by event time. Defaults to `desc`, newest first.
      schema:
        type: string
        enum: [asc, desc]

  responses:

    BadRequest:
      description: The request could not be parsed or a parameter was unusable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: invalid_parameter
            message: limit must be an integer between 1 and 1000
            request_id: 01J9Z3K2QW8XM4P7

    Forbidden:
      description: The caller may not read what was asked for.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: tenant_not_permitted
            message: you may not read tenant demoB
            request_id: 01J9Z3K2QW8XM4P7

    PayloadTooLarge:
      description: The request body exceeded the configured limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: body_too_large
            message: request body exceeds 32 MiB
            request_id: 01J9Z3K2QW8XM4P7

    UnsupportedMediaType:
      description: The Content-Type is not one this endpoint accepts.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unsupported_media_type
            message: expected application/x-ndjson
            request_id: 01J9Z3K2QW8XM4P7

    UnprocessableEntity:
      description: |
        The request parsed, but one or more fields are unusable. This is the
        only status that carries `errors[]`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: invalid_request
            message: the request contains invalid fields
            request_id: 01J9Z3K2QW8XM4P7
            errors:
              - field: severity
                code: out_of_range
                message: severity must be between 0 and 10
              - field: '@timestamp'
                code: invalid_format
                message: expected an RFC 3339 timestamp

    InternalError:
      description: |
        Something failed on the server. The detail is in the logs; quote
        `request_id` when reporting it.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: internal_error
            message: an unexpected error occurred
            request_id: 01J9Z3K2QW8XM4P7

    ServiceUnavailable:
      description: A dependency, normally the database, is unreachable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: database_unavailable
            message: cannot reach the database
            request_id: 01J9Z3K2QW8XM4P7

  headers:
    XRequestId:
      description: Correlates this response with the server log line.
      schema:
        type: string

  schemas:

    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    Source:
      type: string
      description: |
        Source category. Closed set: the database rejects anything else, so an
        unrecognised source on ingest is a rejected record rather than a new
        category.
      enum:
        - firewall
        - network
        - crowdstrike
        - aws
        - m365
        - ad
        - api

    IngestEvent:
      type: object
      additionalProperties: true
      required: [tenant]
      # No x-go-type-import: the generated file already imports encoding/json,
      # and declaring it again emits a duplicate import.
      x-go-type: json.RawMessage
      description: |
        One vendor event, as the vendor emits it.

        Only `tenant` is always required, and `source` is required unless the
        record is a syslog line. The properties below are hints the normalizer
        looks for; anything else is kept verbatim in `raw` and stays
        searchable through the free-text filter. Sending a field this list
        does not mention is normal and is not an error.

        Some vendors spell things differently, and those spellings are
        understood: `ip` means `src_ip`, `user` means the user field, and a
        nested `cloud` object is flattened.

        A record is rejected only when it cannot be stored: it is not a JSON
        object, its tenant is missing or does not exist, or its source is
        missing or not recognised. A hint whose value cannot be normalized,
        such as `"severity": "high"` or text longer than 2048 bytes, is left
        empty instead, and the event is tagged `invalid:<field>`. NUL
        characters and invalid UTF-8, which the database cannot hold, are
        replaced with U+FFFD wherever they appear.

        `tenant` is required for now because there is no authenticated identity
        to derive it from. Once ingest keys carry a tenant, the key wins and
        this field becomes optional.
      properties:
        tenant:
          type: string
          example: demoA
        source:
          type: string
          description: |
            Matched against the known source categories, ignoring case. An
            unrecognised value rejects the record with `unknown_source`.

            May be omitted when `message` holds a syslog line. The source is
            then `firewall` if the line has firewall key=value fields (`action`,
            `src`, `dst`, `spt`, `dpt`, `proto`, `policy`), and `network`
            otherwise.
          example: ad
        '@timestamp':
          type: string
          format: date-time
          x-go-name: Timestamp
          description: |
            Event time. When absent or unparseable, the syslog header time is
            used if the line has an RFC 5424 header, and otherwise the time of
            receipt.

            A time more than the retention period in the past, or more than an
            hour in the future, is replaced with the time of receipt and the
            event is tagged `rebased:timestamp`. Otherwise the event would be
            deleted on arrival or stored ahead of the partitions that exist.
        event_type:
          type: string
        event_subtype:
          type: string
        severity:
          type: integer
          minimum: 0
          maximum: 10
        action:
          type: string
          example: deny
        user:
          type: string
        ip:
          type: string
          description: Understood as `src_ip`.
        src_ip:
          type: string
        dst_ip:
          type: string
        src_port:
          type: integer
          format: int32
        dst_port:
          type: integer
          format: int32
        protocol:
          type: string
        host:
          type: string
        process:
          type: string
        url:
          type: string
        http_method:
          type: string
        status_code:
          type: integer
          format: int32
        rule_name:
          type: string
        rule_id:
          type: string
        vendor:
          type: string
        product:
          type: string
        cloud:
          $ref: '#/components/schemas/CloudContext'
        message:
          type: string
          description: |
            A raw syslog line. When `source` is absent, `firewall` or `network`,
            the line is parsed: an RFC 5424 or RFC 3164 header gives host,
            process and severity, and a key=value body gives the other fields.
            For any other source, `message` is kept in `raw` and not parsed.
        raw:
          type: object
          additionalProperties: true
          description: |
            The original vendor payload. When absent, the whole request body is
            kept as `raw`.
        _tags:
          type: array
          items:
            type: string
          x-go-name: Tags

    CloudContext:
      type: object
      additionalProperties: false
      description: Cloud provider context. Present only when the event carries any of it.
      properties:
        account_id:
          type: string
        region:
          type: string
        service:
          type: string

    IngestResult:
      type: object
      additionalProperties: false
      required: [accepted, rejected]
      description: |
        What happened to the records in the request. `accepted + rejected`
        equals the number of records read.
      properties:
        accepted:
          type: integer
          format: int32
          description: Records normalized and stored.
        rejected:
          type: integer
          format: int32
          description: Records that could not be stored.
        errors:
          type: array
          description: |
            Why records were rejected. Capped at 100 entries; `rejected` is
            always the true count.
          items:
            $ref: '#/components/schemas/IngestRejection'

    IngestRejection:
      type: object
      additionalProperties: false
      required: [index, code, message]
      properties:
        index:
          type: integer
          format: int32
          description: Zero-based position in the request. Always 0 for a single event.
        code:
          type: string
          example: unknown_source
          description: |
            Why the record was not stored:

            - `invalid_json`: the line is not a JSON object.
            - `missing_tenant`, `invalid_tenant`, `unknown_tenant`: no tenant,
              one that is not a valid tenant ID, or one that does not exist.
            - `missing_source`, `unknown_source`: no source on a record that
              is not a syslog line, or one outside the known categories.
            - `unstorable_event`: the database refused one of the record's
              values. The normalizer is meant to prevent this, so it points
              to a loghub bug worth reporting.
        message:
          type: string

    Event:
      type: object
      additionalProperties: false
      required: ['@timestamp', received_at, tenant, source, raw, _tags]
      description: |
        A stored event in the normalized schema. Fields absent from an event
        are omitted rather than returned as null.
      properties:
        id:
          type: string
          description: |
            Opaque identifier, unique with `@timestamp`. A string rather than a
            number so it survives JSON parsers that lose precision past 2^53.
          example: '8123'
        '@timestamp':
          type: string
          format: date-time
          x-go-name: Timestamp
          description: When the event happened.
        received_at:
          type: string
          format: date-time
          description: When loghub received it. Later than `@timestamp` by the collection lag.
        tenant:
          type: string
          example: demoA
        source:
          $ref: '#/components/schemas/Source'
        vendor:
          type: string
        product:
          type: string
        event_type:
          type: string
        event_subtype:
          type: string
        severity:
          type: integer
          minimum: 0
          maximum: 10
        action:
          type: string
          description: |
            Free text, not a closed set. Values seen in practice include
            allow, deny, create, delete, login, logout and alert.
          example: deny
        src_ip:
          type: string
          x-go-type: netip.Addr
          x-go-type-import:
            path: net/netip
          description: Source address. May be IPv4 or IPv6.
          example: 203.0.113.77
        src_port:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
        dst_ip:
          type: string
          x-go-type: netip.Addr
          x-go-type-import:
            path: net/netip
          description: Destination address. May be IPv4 or IPv6.
        dst_port:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
        protocol:
          type: string
        user:
          type: string
          x-go-name: UserName
        host:
          type: string
        process:
          type: string
        url:
          type: string
        http_method:
          type: string
        status_code:
          type: integer
          format: int32
        rule_name:
          type: string
        rule_id:
          type: string
        cloud:
          $ref: '#/components/schemas/CloudContext'
        raw:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          description: |
            The original payload, always a JSON object. An event that arrived
            as a syslog line is kept as `{"message": "<the line>"}`.

            Stored as `jsonb`, so key order is not preserved and duplicate keys
            are dropped: this round-trips semantically, not byte for byte.
        _tags:
          type: array
          items:
            type: string
          x-go-name: Tags
          description: |
            The sender's own tags, followed by tags the normalizer adds:

            - `auth_success`, `auth_failure`: a login and whether it succeeded,
              recognised the same way for every source. Filter on these rather
              than on vendor event names.
            - `rebased:timestamp`: the sent time was outside the accepted
              window, so `@timestamp` is the time of receipt.
            - `invalid:<field>`: that field's value could not be normalized and
              was left empty. The original value is still in `raw`.
          example: [auth_failure]

    EventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          type: string
          description: |
            Pass as `cursor` to get the following page. Absent when this is the
            last page.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable. Match on this; `message` is for people
            and may be reworded at any time.
          example: invalid_request
        message:
          type: string
        request_id:
          type: string
          description: Also returned as the `X-Request-Id` header.
        errors:
          type: array
          description: Per-field failures. Present only on 422.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          example: severity
        code:
          type: string
          example: out_of_range
        message:
          type: string

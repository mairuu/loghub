# Lint, test, and run the acceptance checks against a fresh appliance, on
# every push and pull request. Each job runs the make targets a developer
# does; tests/README.md describes them. Deploys stay manual (ADR 0011).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The Makefile reads the database credentials from .env as it starts,
      # so .env has to exist before test-db runs.
      - run: make env
      - run: make test-db
      - run: make test-web

  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make up
      - run: make ca
      - run: make acceptance
      # Every kind of event and incident the simulator sends, which the
      # backend must store without rejecting any.
      - run: samples/simulate.py --backfill 6h --incident-every 5m --for 0
      # What was just sent shows in the counts Prometheus would scrape, read
      # from inside the stack since neither port is published.
      - name: Check the metrics
        run: |
          backend=$(docker compose exec -T vector wget -q -O - http://backend:9090/metrics)
          grep -E '^loghub_ingested_events_total\{source="firewall",tenant="demoA"\} [1-9]' <<<"$backend"
          grep -E '^loghub_sign_ins_total\{outcome="signed_in"\} [1-9]' <<<"$backend"
          vector=$(docker compose exec -T vector wget -q -O - http://127.0.0.1:9598/metrics)
          grep -E '^vector_component_received_events_total\{.*component_id="syslog_udp"' <<<"$vector"
      - name: Show the stack's state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
